<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>植物の成長モデル ── 東から西へ渡る太陽</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#eef1ec; --fg:#1f2a22; --muted:#5d6b61; --line:#c9d2c9;
  --btn:#ffffff; --btn-on:#2f6b3f; --btn-on-fg:#ffffff;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#161b18; --fg:#e4ebe5; --muted:#9aa89e; --line:#34403a;
    --btn:#222a25; --btn-on:#5fa870; --btn-on-fg:#0f1511;
  }
}
:root[data-theme="dark"]{
  --bg:#161b18; --fg:#e4ebe5; --muted:#9aa89e; --line:#34403a;
  --btn:#222a25; --btn-on:#5fa870; --btn-on-fg:#0f1511;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);
  font-family:"Zen Kaku Gothic New","Hiragino Sans","Noto Sans JP","Yu Gothic",sans-serif;
  line-height:1.7}
main{max-width:760px;margin:0 auto;padding:20px 16px 28px}
h1{font-size:1.3rem;font-weight:700;margin:0 0 4px;letter-spacing:.02em}
p.lead{margin:0 0 14px;color:var(--muted);font-size:.92rem;max-width:62ch}
figure{margin:0;border-radius:10px;overflow:hidden;border:1px solid var(--line)}
svg{display:block;width:100%;height:auto}
.bar{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;margin:12px 0 4px}
.grp{display:flex;gap:4px;align-items:center;flex-wrap:wrap}
.grp span{font-size:.82rem;color:var(--muted);margin-right:2px}
button{font:inherit;font-size:.85rem;padding:5px 11px;border-radius:6px;
  border:1px solid var(--line);background:var(--btn);color:var(--fg);cursor:pointer}
button[aria-pressed="true"]{background:var(--btn-on);color:var(--btn-on-fg);border-color:var(--btn-on)}
button:focus-visible{outline:2px solid var(--btn-on);outline-offset:2px}
.read{font-variant-numeric:tabular-nums;font-size:.92rem;min-height:1.7em}
.legend{display:flex;flex-wrap:wrap;gap:4px 16px;font-size:.8rem;color:var(--muted);margin-top:6px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;vertical-align:-1px}
</style>
</head>
<body>
<main>
<h1>植物の成長モデル ── 東から西へ渡る太陽</h1>
<p class="lead">ペンローズ担体（14行・五角形721枚）の上で、地面の星から芽を伸ばします。一歩は「まわり5枚のうち最も明るい向きの隣へ」。最も明るいものが二つ並んだとき二葉に分かれます。</p>
<figure><svg id="fig" viewBox="-48 -16 96 104" role="img" aria-label="太陽の動きに合わせて枝分かれしながら伸びる植物"></svg></figure>
<div class="read" id="read" aria-live="polite"></div>
<div class="bar">
  <div class="grp"><button id="play" aria-pressed="true">一時停止</button></div>
  <div class="grp"><span>太陽</span>
    <button data-mode="ew" aria-pressed="true">東から西へ</button>
    <button data-mode="fix" aria-pressed="false">真上に止める</button></div>
  <div class="grp" id="seeds"><span>芽の位置</span></div>
</div>
<div class="legend">
  <span><i style="background:#d08a2e"></i>a の星（最上段と同じ向き）</span>
  <span><i style="background:#4f76b3"></i>b の星（逆の向き）</span>
  <span><i style="background:#3f9a4f"></i>伸びた枝</span>
  <span><i style="background:transparent;border:2px solid #e2502f"></i>二葉に分かれた星</span>
</div>
</main>

const NS="http://www.w3.org/2000/svg";
const svg=document.getElementById('fig');
const el=(t,a,p)=>{const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);(p||svg).appendChild(e);return e;};
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;

// 空・地面
const sky=el('rect',{x:-48,y:-16,width:96,height:104,fill:'#bcd3e0'});
const glow=el('circle',{r:0,fill:'#fff6d0',opacity:.0});
el('rect',{x:-48,y:84,width:96,height:4,fill:'#6f5a3f',opacity:.55});
// 担体
const gC=el('g',{});
for(const P of D.pent) el('polygon',{points:P.map(p=>p.join(',')).join(' '),
  fill:'#f4f6f1',stroke:'#98a69a','stroke-width':.12,'fill-opacity':.55},gC);
// 太陽の通り道
const CX=0,CY=84,RX=43,RY=96;
let arc='';for(let a=180;a<=360;a+=3){const r=a*Math.PI/180;arc+=(arc?'L':'M')+(CX+RX*Math.cos(r)).toFixed(2)+','+(CY+RY*Math.sin(r)).toFixed(2);}
el('path',{d:arc,fill:'none',stroke:'#ffffff','stroke-opacity':.35,'stroke-width':.25,'stroke-dasharray':'1 1.2'});
const gRay=el('g',{});
const sun=el('circle',{r:3.2,fill:'#f5c542',stroke:'#fff3c4','stroke-width':.6});
// 枝・星
const gB=el('g',{});
const gS=el('g',{});
const S=D.stars;
const starDot=S.map(([x,y,o])=>el('circle',{cx:x,cy:y,r:.95,fill:o==='a'?'#d08a2e':'#4f76b3'},gS));
const gT=el('g',{});
const gX=el('g',{});

let mode='ew', seed=String(D.ground[2]), t=0, playing=!reduce, timer=null;
const seedsBox=document.getElementById('seeds');
D.ground.forEach((g,k)=>{const b=document.createElement('button');b.textContent=String(k+1);
  b.setAttribute('aria-pressed',String(g)===seed);b.dataset.seed=g;
  b.setAttribute('aria-label','地面の'+(k+1)+'番目の星から伸ばす');
  b.onclick=()=>{seed=String(g);[...seedsBox.querySelectorAll('button')].forEach(x=>x.setAttribute('aria-pressed',x===b));reset();};
  seedsBox.appendChild(b);});
document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{mode=b.dataset.mode;
  document.querySelectorAll('[data-mode]').forEach(x=>x.setAttribute('aria-pressed',x===b));reset();});
const playBtn=document.getElementById('play');
playBtn.onclick=()=>{playing=!playing;playBtn.textContent=playing?'一時停止':'再生';playBtn.setAttribute('aria-pressed',playing);if(playing)loop();};
playBtn.textContent=playing?'一時停止':'再生';playBtn.setAttribute('aria-pressed',playing);

const F=()=>D.sim[mode][seed];
const DAYS=2, PER=13;
function mix(a,b,k){const p=s=>[1,3,5].map(i=>parseInt(s.slice(i,i+2),16));const A=p(a),B=p(b);
  return '#'+A.map((v,i)=>Math.round(v+(B[i]-v)*k).toString(16).padStart(2,'0')).join('');}
function drawSun(deg){
  gRay.innerHTML='';
  if(deg===null){sun.setAttribute('opacity',0);glow.setAttribute('opacity',0);sky.setAttribute('fill','#1f2a3d');return;}
  const r=deg*Math.PI/180; const sx=CX+RX*Math.cos(r), sy=CY+RY*Math.sin(r);
  sun.setAttribute('cx',sx);sun.setAttribute('cy',sy);sun.setAttribute('opacity',1);
  glow.setAttribute('cx',sx);glow.setAttribute('cy',sy);glow.setAttribute('r',16);glow.setAttribute('opacity',.35);
  const h=Math.max(0,-Math.sin(r)); // 0 地平 → 1 真上
  sky.setAttribute('fill',mix('#e9b98f','#bcd8ea',h));
  // 平行光：太陽の方向から差す光線
  const ux=-Math.cos(r),uy=-Math.sin(r), nx=-uy, ny=ux;
  for(let k=-4;k<=4;k++){const ox=sx+nx*k*7, oy=sy+ny*k*7;
    el('line',{x1:ox,y1:oy,x2:ox+ux*40,y2:oy+uy*40,stroke:'#fff4c9','stroke-opacity':.28,'stroke-width':.35},gRay);}
}
function reset(){t=0;gB.innerHTML='';gT.innerHTML='';gX.innerHTML='';render(true);}
function render(first){
  const fr=F();
  if(t>=fr.length){return;}
  const cur=fr[t];
  drawSun(cur.sun);
  if(t===0&&first){}
  for(const [a,b] of cur.edges){
    const [x1,y1]=S[a],[x2,y2]=S[b];
    const L=Math.hypot(x2-x1,y2-y1);
    const ln=el('line',{x1,y1,x2,y2,stroke:'#3f9a4f','stroke-width':.9,'stroke-linecap':'round',
      'stroke-dasharray':L,'stroke-dashoffset':reduce?0:L},gB);
    if(!reduce){ln.animate([{strokeDashoffset:L},{strokeDashoffset:0}],{duration:420,fill:'forwards',easing:'ease-out'});}
  }
  gT.innerHTML='';
  for(const i of cur.tips) el('circle',{cx:S[i][0],cy:S[i][1],r:1.6,fill:'#9fd86b',stroke:'#2f6b3f','stroke-width':.35},gT);
  for(const i of cur.splits){
    el('circle',{cx:S[i][0],cy:S[i][1],r:2.6,fill:'none',stroke:'#e2502f','stroke-width':.55},gX);
  }
  const deg=cur.sun===null?'夜':`太陽 ${cur.sun}°`;
  const sp=cur.splits.length?`／ ${cur.splits.map(i=>S[i][2]).join('・')} の星で二葉`:'';
  document.getElementById('read').textContent=`${cur.d+1}日目 ${cur.f+1}コマ ／ ${deg} ／ 先端 ${cur.tips.length}本 ${sp}`;
}
// 地面の星に芽を置いて始める
function start(){gT.innerHTML='';const g=+seed;el('circle',{cx:S[g][0],cy:S[g][1],r:1.6,fill:'#9fd86b',stroke:'#2f6b3f','stroke-width':.35},gT);}
function loop(){
  clearTimeout(timer);
  if(!playing)return;
  const n=DAYS*PER;
  if(t===0){gB.innerHTML='';gX.innerHTML='';start();}
  render(); t++;
  if(t>=n){timer=setTimeout(()=>{t=0;loop();},2600);return;}
  timer=setTimeout(loop,700);
}
function resetAndGo(){t=0;gB.innerHTML='';gX.innerHTML='';start();drawSun(F()[0].sun);
  document.getElementById('read').textContent='1日目 ／ 地面の星から芽を出す'; if(playing)loop();}
reset=resetAndGo;
if(reduce){ // 動きを減らす設定では、最後の姿まで一度に描く
  for(t=0;t<DAYS*PER;t++)render(); t=0;
}else resetAndGo();
</script>
