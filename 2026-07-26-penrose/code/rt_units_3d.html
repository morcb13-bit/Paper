const cv=document.getElementById('cv'),g=cv.getContext('2d');
let rx=-0.45, ry=0.6, zoom=1, cur=0, drag=null;

function rot(p){
  let [x,y,z]=p;
  let c=Math.cos(ry),s=Math.sin(ry); let X=x*c-z*s, Z=x*s+z*c;
  c=Math.cos(rx); s=Math.sin(rx); let Y=y*c-Z*s; Z=y*s+Z*c;
  return [X,Y,Z];
}
function proj(p){
  const S=Math.min(cv.width,cv.height)/(2.15*D.configs[cur].r)*zoom;
  return [cv.width/2+p[0]*S, cv.height/2-p[1]*S];
}
function draw(){
  g.fillStyle='#fffdf8'; g.fillRect(0,0,cv.width,cv.height);
  const cfg=D.configs[cur], polys=[];
  const L=(()=>{const v=[0.42,0.78,0.47];const m=Math.hypot(...v);return v.map(x=>x/m);})();
  for(const c of cfg.centers){
    for(const f of D.rt){
      const q=f.q.map(v=>rot([v[0]+c[0],v[1]+c[1],v[2]+c[2]]));
      const n=rot(f.n);
      const zc=q.reduce((a,p)=>a+p[2],0)/4;
      polys.push({q,n,z:zc});
    }
  }
  polys.sort((a,b)=>a.z-b.z);
  for(const p of polys){
    if(p.n[2]<0) continue;
    const d=p.n[0]*L[0]+p.n[1]*L[1]+p.n[2]*L[2];
    const t=(d+1)/2;
    const hue=212-(212-20)*Math.max(0,Math.min(1,t));
    const lig=60+26*Math.max(0,Math.min(1,t));
    g.beginPath();
    const pts=p.q.map(proj);
    g.moveTo(pts[0][0],pts[0][1]);
    for(let i=1;i<4;i++) g.lineTo(pts[i][0],pts[i][1]);
    g.closePath();
    g.fillStyle=`hsl(${hue} 30% ${lig}%)`;
    g.fill();
    g.strokeStyle='#5b5b6a'; g.lineWidth=1; g.stroke();
  }
}
function setCur(i){
  cur=i; zoom=1;
  document.getElementById('note').textContent=D.configs[i].note;
  [...document.querySelectorAll('#btns button')].forEach((b,k)=>
    b.setAttribute('aria-pressed', k===i?'true':'false'));
  draw();
}
const bt=document.getElementById('btns');
D.configs.forEach((c,i)=>{
  const b=document.createElement('button');
  b.textContent=c.label; b.onclick=()=>setCur(i); bt.appendChild(b);
});
cv.addEventListener('pointerdown',e=>{drag=[e.clientX,e.clientY];cv.setPointerCapture(e.pointerId);});
cv.addEventListener('pointermove',e=>{
  if(!drag)return;
  ry+=(e.clientX-drag[0])*0.008; rx+=(e.clientY-drag[1])*0.008;
  drag=[e.clientX,e.clientY]; draw();
});
cv.addEventListener('pointerup',()=>drag=null);
cv.addEventListener('wheel',e=>{e.preventDefault();zoom*=e.deltaY<0?1.08:1/1.08;
  zoom=Math.max(.4,Math.min(4,zoom));draw();},{passive:false});
setCur(0);
</script>
