<text x="450.0" y="40.0" font-size="21" fill="#16202b" text-anchor="middle" font-weight="700">3つのV字は、大きなV字にならない</text>
<text x="450.0" y="63.0" font-size="13.5" fill="#5b6675" text-anchor="middle" font-weight="400">だから3進の桁は一段で止まる。そこから先は φ が引き取る</text>
