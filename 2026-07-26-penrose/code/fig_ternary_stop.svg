<text x="450.0" y="287.1" font-size="17" fill="#c0392b" text-anchor="middle" font-weight="700">152.77°</text>
<text x="450.0" y="307.1" font-size="12.5" fill="#5b6675" text-anchor="middle" font-weight="400">V字なら 108° のはず</text>
<text x="60.0" y="352.0" font-size="13" fill="#16202b" text-anchor="start" font-weight="400">9 = 3+3+3。V字を三つ並べて、その中心（赤）を結ぶ（破線）。</text>
<text x="60.0" y="374.0" font-size="13" fill="#5b6675" text-anchor="start" font-weight="400">折れ角は 108° にならず 152.77°。三つのV字は一段上のV字を作らないので、同じ読みを繰り返せない。</text>
<text x="60.0" y="396.0" font-size="13" fill="#5b6675" text-anchor="start" font-weight="400">一方 φ の側は繰り返せる ── 型紙が当たるのは φ² 倍のときだけ、直線の間隔は √5·φ^m。</text>
