<title>右と左の一個差</title>
<style>

  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --bg: #17181b; --panel: #222429; --ink: #e8e6e1; --muted: #9a9a9a; --line: #3a3d44; --plus: #e07a5f; --minus: #5fa8e0; --empty: #2c2f35; --accent: #d9b44a; }
  }
  :root[data-theme="dark"] { --bg: #17181b; --panel: #222429; --ink: #e8e6e1; --muted: #9a9a9a; --line: #3a3d44; --plus: #e07a5f; --minus: #5fa8e0; --empty: #2c2f35; --accent: #d9b44a; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
         font-family: "Hiragino Sans", "Noto Sans JP", system-ui, sans-serif; }
  .wrap { max-width: 980px; margin: 0 auto; padding: 16px; }
  h1 { font-size: 1.25rem; margin: 4px 0 2px; }
  .sub { color: var(--muted); font-size: .88rem; margin-bottom: 12px; line-height: 1.6; }
  .grid { display: grid; grid-template-columns: 1fr 300px; gap: 12px; }
  @media (max-width: 760px) { .grid { grid-template-columns: 1fr; } }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 10px; }
  canvas { width: 100%; display: block; touch-action: manipulation; }
  .row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin: 6px 0; }
  button { font: inherit; font-size: .85rem; padding: 5px 10px; border-radius: 6px;
           border: 1px solid var(--line); background: var(--bg); color: var(--ink); cursor: pointer; }
  button.on { border-color: var(--accent); color: var(--accent); font-weight: 600; }
  label { font-size: .85rem; color: var(--muted); }
  .stat { font-variant-numeric: tabular-nums; font-size: .95rem; line-height: 1.8; }
  .stat b.p { color: var(--plus); } .stat b.m { color: var(--minus); }
  .verdict { font-size: .9rem; margin-top: 4px; }
  .ok { color: var(--accent); font-weight: 600; } .ng { color: var(--muted); }
  .note { color: var(--muted); font-size: .8rem; line-height: 1.6; margin-top: 8px; }
  input[type=range] { width: 120px; }
</style>

<body>
<div class="wrap">
  <h1>右と左の一個差 ― ペンローズの担体で読む不斉自己触媒</h1>
  <div class="sub">五角形420枚の担体。赤が＋（右型）、青が−（左型）。鏡に映すと重なる対に＋と−を3組置き、どこか1枚に1個だけ足す。五角形をクリックすると、そこを着地にして最初からやり直す。</div>
  <div class="grid">
    <div class="panel"><canvas id="cv" width="900" height="900"></canvas></div>
    <div class="panel">
      <div class="row">
        <button id="play">停止</button><button id="stepb">一歩</button><button id="reset">初めから</button>
      </div>
      <div class="row"><label>速さ</label><input id="speed" type="range" min="1" max="20" value="6"></div>
      <div class="row">
        <button id="tCopy" class="on">写す（足し込み）</button>
        <button id="tPair" class="on">組を除く</button>
        <button id="tStir">並べ替え k=11</button>
      </div>
      <div class="row">
        <button id="sPlus" class="on">＋を足す</button>
        <button id="sMinus">−を足す</button>
        <button id="sNone">足さない（対称）</button>
      </div>
      <div class="stat" id="stat"></div>
      <canvas id="hist" width="560" height="260"></canvas>
      <div class="verdict" id="verdict"></div>
      <div class="note">
        判定は整数の比較だけ。F1（増幅）：ある歩以降 |D| が初期の2倍以上。F2（飽和）：20×同じ側 ≥ 19×占有、かつ占有が初期以上。<br>
        並べ替えは型を見ず、番地を11飛びに読み直すだけ。各歩は「写す → 組を除く → 並べ替え」の順。400歩で止まる。
      </div>
    </div>
  </div>
</div>

const N = DATA.xy.length, NB = DATA.nb, CONJ = DATA.conj, PAIRS = DATA.pairs;
const MAXSTEP = 400, K = 11;
let useCopy = true, usePair = true, useStir = false, sign = 1, landing = 250;
let x, hist, stepNo, D0, occ0, playing = true;

function seed() {
  const s = new Array(N).fill(0);
  for (const i of PAIRS) { s[i] = 1; s[CONJ[i]] = -1; }
  if (sign !== 0 && s[landing] === 0) s[landing] = sign;
  return s;
}
function count(s) { let p = 0, m = 0; for (const v of s) { if (v > 0) p += 1; else if (v < 0) m += 1; } return [p, m]; }
function step(s) {
  let y = s.slice();
  if (useCopy) for (let i = 0; i < N; i++) if (s[i] === 0) {
    let t = 0; for (const j of NB[i]) t += s[j];
    if (t > 0) y[i] = 1; else if (t < 0) y[i] = -1;
  }
  if (usePair) {
    const z = y.slice();
    for (let i = 0; i < N; i++) if (y[i] !== 0) for (const j of NB[i]) if (y[j] === -y[i]) { z[i] = 0; break; }
    y = z;
  }
  if (useStir) {
    const w = new Array(N).fill(0); let j = 0;
    for (let i = 0; i < N; i++) { w[i] = y[j]; j += K; while (j >= N) j += -N; }
    y = w;
  }
  return y;
}
function reset() {
  x = seed(); const [p, m] = count(x); D0 = p - m; occ0 = p + m; hist = [[p, m]]; stepNo = 0; draw();
}
function abs(a) { return a >= 0 ? a : -a; }
function judge() {
  const a0 = abs(D0); let f1 = false;
  if (a0 > 0 && stepNo >= 1) {
    for (let t = 1; t < hist.length; t++) {
      let all = true;
      for (let u = t; u < hist.length; u++) if (abs(hist[u][0] - hist[u][1]) < a0 + a0) { all = false; break; }
      if (all) { f1 = true; break; }
    }
  }
  const [R, L] = hist[hist.length - 1], D = R - L, occ = R + L, same = D >= 0 ? R : L;
  const f2 = occ > 0 && D !== 0 && 20 * same >= 19 * occ && occ >= occ0;
  return [f1, f2];
}

// ── 観察者側の表示（座標の換算だけ浮動小数） ──
const cv = document.getElementById("cv"), cx = cv.getContext("2d");
let minX = 1e9, maxX = -1e9, minY = 1e9, maxY = -1e9;
for (const [a, b] of DATA.xy) { minX = Math.min(minX, a); maxX = Math.max(maxX, a); minY = Math.min(minY, b); maxY = Math.max(maxY, b); }
const pad = 1.4, scale = 900 / Math.max(maxX - minX + 2 * pad, maxY - minY + 2 * pad);
const ox = (900 - (maxX - minX) * scale) / 2, oy = (900 - (maxY - minY) * scale) / 2;
function px(a) { return ox + (a - minX) * scale; }
function py(b) { return 900 - (oy + (b - minY) * scale); }
function css(v) { return getComputedStyle(document.documentElement).getPropertyValue(v).trim(); }

function pentagon(i) {
  const [a, b, par] = DATA.xy[i], r = 0.93 * scale, rot = par ? Math.PI / 5 : 0;
  const cxp = px(a), cyp = py(b);
  cx.beginPath();
  for (let k = 0; k < 5; k++) {
    const t = rot + k * 2 * Math.PI / 5;
    const X = cxp + r * Math.cos(t), Y = cyp - r * Math.sin(t);
    if (k === 0) cx.moveTo(X, Y); else cx.lineTo(X, Y);
  }
  cx.closePath();
}
function draw() {
  const cPlus = css("--plus"), cMinus = css("--minus"), cEmpty = css("--empty"), cLine = css("--line"), cAcc = css("--accent");
  cx.clearRect(0, 0, 900, 900);
  for (let i = 0; i < N; i++) {
    pentagon(i);
    cx.fillStyle = x[i] > 0 ? cPlus : x[i] < 0 ? cMinus : cEmpty; cx.fill();
    cx.strokeStyle = cLine; cx.lineWidth = 1; cx.stroke();
  }
  if (stepNo === 0 && sign !== 0) { pentagon(landing); cx.strokeStyle = cAcc; cx.lineWidth = 4; cx.stroke(); }
  drawHist();
  const [p, m] = hist[hist.length - 1];
  document.getElementById("stat").innerHTML =
    `歩 ${stepNo} / ${MAXSTEP}<br><b class="p">N+ ${p}</b>　<b class="m">N− ${m}</b><br>D = N+ − N− = ${p - m}（初期 ${D0}）<br>占有 ${p + m}（初期 ${occ0}）`;
  const [f1, f2] = judge();
  document.getElementById("verdict").innerHTML =
    `F1 増幅 <span class="${f1 ? "ok" : "ng"}">${f1 ? "OK" : "NG"}</span>　F2 飽和 <span class="${f2 ? "ok" : "ng"}">${f2 ? "OK" : "NG"}</span>`;
}
const hc = document.getElementById("hist"), hx = hc.getContext("2d");
function drawHist() {
  const W = 560, H = 260; hx.clearRect(0, 0, W, H);
  hx.strokeStyle = css("--line"); hx.strokeRect(0.5, 0.5, W - 1, H - 1);
  const lines = [[0, css("--plus")], [1, css("--minus")]];
  for (const [c, col] of lines) {
    hx.beginPath();
    for (let t = 0; t < hist.length; t++) {
      const X = 4 + (W - 8) * t / MAXSTEP, Y = H - 4 - (H - 8) * hist[t][c] / N;
      if (t === 0) hx.moveTo(X, Y); else hx.lineTo(X, Y);
    }
    hx.strokeStyle = col; hx.lineWidth = 2; hx.stroke();
  }
}

function advance() {
  if (stepNo >= MAXSTEP) { playing = false; document.getElementById("play").textContent = "再生"; return; }
  x = step(x); stepNo += 1; hist.push(count(x));
}
let acc = 0;
function loop() {
  if (playing) {
    acc += +document.getElementById("speed").value;
    while (acc >= 10) { acc += -10; advance(); }
    draw();
  }
  requestAnimationFrame(loop);
}
function toggle(id, f) {
  document.getElementById(id).onclick = () => { f(); setButtons(); reset(); playing = true; document.getElementById("play").textContent = "停止"; };
}
function setButtons() {
  document.getElementById("tCopy").classList.toggle("on", useCopy);
  document.getElementById("tPair").classList.toggle("on", usePair);
  document.getElementById("tStir").classList.toggle("on", useStir);
  document.getElementById("sPlus").classList.toggle("on", sign === 1);
  document.getElementById("sMinus").classList.toggle("on", sign === -1);
  document.getElementById("sNone").classList.toggle("on", sign === 0);
}
toggle("tCopy", () => useCopy = !useCopy);
toggle("tPair", () => usePair = !usePair);
toggle("tStir", () => useStir = !useStir);
toggle("sPlus", () => sign = 1);
toggle("sMinus", () => sign = -1);
toggle("sNone", () => sign = 0);
document.getElementById("play").onclick = () => {
  if (stepNo >= MAXSTEP) reset();
  playing = !playing; document.getElementById("play").textContent = playing ? "停止" : "再生";
};
document.getElementById("stepb").onclick = () => { playing = false; document.getElementById("play").textContent = "再生"; advance(); draw(); };
document.getElementById("reset").onclick = () => { reset(); };
cv.addEventListener("click", ev => {
  const rc = cv.getBoundingClientRect();
  const X = (ev.clientX - rc.left) * 900 / rc.width, Y = (ev.clientY - rc.top) * 900 / rc.height;
  let best = -1, bd = 1e18;
  for (let i = 0; i < N; i++) { const dx = px(DATA.xy[i][0]) - X, dy = py(DATA.xy[i][1]) - Y, d = dx * dx + dy * dy; if (d < bd) { bd = d; best = i; } }
  if (best >= 0 && seed()[best] === 0 || (best >= 0 && !PAIRS.includes(best) && !PAIRS.map(i => CONJ[i]).includes(best))) {
    landing = best; if (sign === 0) sign = 1; setButtons(); reset(); playing = true; document.getElementById("play").textContent = "停止";
  }
});
setButtons(); reset(); loop();
