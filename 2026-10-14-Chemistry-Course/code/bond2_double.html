<title>二重結合の腕</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;700&family=IBM+Plex+Mono:wght@400;600&display=swap">
<style>
/* layout: 図が一番上（凡例と段の説明は図の中）、すぐ下に操作と腕の札、説明はその下 */
:root{
  --bg:#f3f4f2; --panel:#ffffff; --fg:#1d2422; --muted:#5f6b67; --line:#c9cfcc;
  --idle:#a3aca9; --bond:#7a3fd1; --harm:#2f80c0; --lp:#d08a0c;
  --atomC:#2b2f2e; --atomO:#d0402f; --hball:#eef3f6; --hline:#2f80c0;
  --f-body:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#141917; --panel:#1c2220; --fg:#e4e9e6; --muted:#9aa6a1; --line:#33403c;
  --idle:#5d6a66; --bond:#b48cff; --harm:#6fb3e6; --lp:#f0b33a;
  --atomC:#cfd6d3; --atomO:#ff7a66; --hball:#2a3438; --hline:#6fb3e6; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141917; --panel:#1c2220; --fg:#e4e9e6; --muted:#9aa6a1; --line:#33403c;
  --idle:#5d6a66; --bond:#b48cff; --harm:#6fb3e6; --lp:#f0b33a;
  --atomC:#cfd6d3; --atomO:#ff7a66; --hball:#2a3438; --hline:#6fb3e6; color-scheme:dark}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);line-height:1.7}
.wrap{max-width:860px;margin:0 auto;padding-block:12px 32px;padding-inline:16px;display:grid;gap:12px}
canvas{width:100%;aspect-ratio:4/3;max-width:100%;background:var(--panel);border:1px solid var(--line);border-radius:6px;touch-action:none;cursor:grab;display:block}
.ctrl{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center}
button{font:inherit;font-size:.82rem;padding:4px 10px;border:1px solid var(--line);background:var(--panel);color:var(--fg);border-radius:4px;cursor:pointer}
button:hover{border-color:var(--bond)} button:focus-visible{outline:2px solid var(--bond);outline-offset:2px}
button[aria-pressed="true"]{border-color:var(--bond);color:var(--bond)}
.spd{display:flex;align-items:center;gap:6px;font-size:.8rem;color:var(--muted)}
.spd input{width:110px}
.tally{display:flex;flex-wrap:wrap;gap:8px 18px;font-size:.85rem}
.atom{display:flex;align-items:center;gap:6px}
.atom b{font-family:var(--f-mono);min-width:2.2em}
.chip{width:22px;height:12px;border-radius:3px;background:var(--idle);display:inline-block}
.len{font-family:var(--f-mono);font-size:.82rem;color:var(--muted);font-variant-numeric:tabular-nums}
h1{font-size:1.3rem;margin:8px 0 0;text-wrap:balance}
.lead{margin:0;max-width:65ch}
.count{margin:0;font-size:.9rem;color:var(--muted);max-width:65ch}
</style>

<div class="wrap">
  <canvas id="cv" width="1200" height="900" aria-label="二重結合 ― 腕 2 本ずつで辺をつなぐ の立体図。ドラッグで回せる"></canvas>
  <div class="ctrl">
    <button id="play" aria-pressed="true">再生中</button>
    <button id="step">次の段</button>
    <button id="spin" aria-pressed="true">回転</button>
    <label class="spd" for="spd">速さ <input id="spd" type="range" min="1" max="100" value="45"></label>
  </div>
  <div class="tally" id="tally"></div>
  <h1>二重結合 ― 腕 2 本ずつで辺をつなぐ</h1>
  <p class="lead">二つの炭素が正四面体の辺を一本共有すると、それぞれの腕が 2 本ずつ、辺の両端で出会う。これが二重結合。残った腕 2 本ずつに水素がつく。水素 4 個は一枚の平面に並び、エチレン C₂H₄ の平らな形になる。</p>
  <p class="count">腕の勘定：炭素 2 個で 8 本 ＝ 炭素どうし 4 本（2 組）＋ 水素 4 本</p>
</div>

<script>
const DATA={"scenes": [{"cap": "エチレン C₂H₄", "atoms": [{"el": "C", "center": [0, 0, 0], "verts": [[3, 3, 3], [3, -3, -3], [-3, 3, -3], [-3, -3, 3]], "arms": ["bond", "bond", "H", "H"]}, {"el": "C", "center": [6, 0, 0], "verts": [[3, -3, -3], [3, 3, 3], [9, -3, 3], [9, 3, -3]], "arms": ["bond", "bond", "H", "H"]}], "tally": {"bond": 4, "H": 4, "lp": 0}, "len2": 36}]};
const S=DATA.scenes[0];
const atoms=S.atoms;
const same=(p,q)=>p[0]===q[0]&&p[1]===q[1]&&p[2]===q[2];
const STAGES=["1. 離れている：腕は 4 本ずつ","2. 近づく","3. 出会った腕がつながる","4. 残った腕が埋まる"];
const NAMES=(()=>{const c={};atoms.forEach(a=>c[a.el]=(c[a.el]||0)+1);const k={};
  return atoms.map(a=>{if(c[a.el]===1)return a.el;k[a.el]=(k[a.el]||0)+1;return a.el+"₁₂₃"[k[a.el]-1];});})();

// ---- ここから先は観察者側の表示（回転・透視・動きの補間だけ浮動小数） ----
const cv=document.getElementById("cv"), g=cv.getContext("2d");
const css=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
let theta=0.5, tilt=0.38, spin=true, play=true, speed=0.45, stage=0, tStage=0, last=performance.now();
const K=6;
let cen=[0,0,0]; atoms.forEach(a=>cen=cen.map((x,i)=>x+a.center[i]/atoms.length));
const dirs=atoms.map(a=>{const d=a.center.map((x,i)=>x-cen[i]);const L=Math.hypot(...d);return L?d.map(x=>x/L):[0,0,0];});
// 分子の軸（原子の中心を結ぶ向き）を画面の横に置く
const ax0=atoms[1].center.map((x,i)=>x-atoms[0].center[i]), aL=Math.hypot(...ax0), e1=ax0.map(x=>x/aL);
let t0=Math.abs(e1[0])<0.9?[1,0,0]:[0,1,0]; let d0=t0.reduce((s,x,i)=>s+x*e1[i],0);
let e2=t0.map((x,i)=>x-d0*e1[i]); const l2=Math.hypot(...e2); e2=e2.map(x=>x/l2);
const e3=[e1[1]*e2[2]-e1[2]*e2[1],e1[2]*e2[0]-e1[0]*e2[2],e1[0]*e2[1]-e1[1]*e2[0]];
const dt3=(a,b)=>a[0]*b[0]+a[1]*b[1]+a[2]*b[2];
let RX=0,RY=0; atoms.forEach(a=>a.verts.forEach(v=>{const r=v.map((x,i)=>x-cen[i]);RX=Math.max(RX,Math.abs(dt3(r,e1)));RY=Math.max(RY,Math.hypot(dt3(r,e2),dt3(r,e3)));}));
function proj(p){
  const r=p.map((x,i)=>x-cen[i]);
  const x=dt3(r,e1), y0=dt3(r,e2), z0=dt3(r,e3);
  const c=Math.cos(theta), s=Math.sin(theta);
  const y1=c*y0-s*z0, z1=s*y0+c*z0;
  const ct=Math.cos(tilt), st=Math.sin(tilt);
  const x2=ct*x+st*z1, z2=-st*x+ct*z1;
  const sc=Math.min(0.40*cv.width/(RX+K*0.5), 0.40*cv.height/RY), f=1/(1+z2/((RX+RY)*4));
  return [cv.width/2+x2*sc*f, cv.height*0.52-y1*sc*f, z2, f];
}
function rgba(c,a){const d=document.createElement("canvas").getContext("2d");d.fillStyle=c;const h=d.fillStyle;
  if(h[0]==="#"){return`rgba(${parseInt(h.slice(1,3),16)},${parseInt(h.slice(3,5),16)},${parseInt(h.slice(5,7),16)},${a})`;}return h;}
const ease=t=>t<0?0:t>1?1:t*t*(3-2*t);
function armState(s){ // いまの段での腕の色
  if(stage<2) return "idle";
  if(s==="bond") return "bond";
  return stage>=3 ? s : "idle";
}
const COL={idle:"--idle",bond:"--bond",H:"--harm",lp:"--lp"};
function offset(ai){
  let e= stage===0?0: stage===1?ease(tStage/2.2):1;
  const k=(1-e)*K; return dirs[ai].map(x=>x*k);
}
function draw(){
  g.clearRect(0,0,cv.width,cv.height);
  const R=cv.height/46, items=[], atomsDraw=[];
  const pal=Object.fromEntries(Object.entries(COL).map(([k,v])=>[k,css(v)]));
  const fade= stage>=3? ease(tStage/0.8):0;
  atoms.forEach((a,ai)=>{
    const o=offset(ai), V=a.verts.map(v=>v.map((x,i)=>x+o[i])), C=a.center.map((x,i)=>x+o[i]);
    const ac=css(a.el==="O"?"--atomO":"--atomC");
    const PC=proj(C), PV=V.map(proj);
    [[0,1,2],[0,1,3],[0,2,3],[1,2,3]].forEach(f=>items.push({z:(PV[f[0]][2]+PV[f[1]][2]+PV[f[2]][2])/3+0.5,k:"face",P:f.map(i=>PV[i]),c:rgba(ac,0.05)}));
    [[0,1],[0,2],[0,3],[1,2],[1,3],[2,3]].forEach(([i,j])=>items.push({z:(PV[i][2]+PV[j][2])/2+0.4,k:"edge",P:[PV[i],PV[j]],c:rgba(ac,0.35)}));
    a.arms.forEach((s,vi)=>{
      const st=armState(s);
      items.push({z:(PC[2]+PV[vi][2])/2,k:"arm",P:[PC,PV[vi]],c:pal[st]});
      if(st==="H") atomsDraw.push({z:PV[vi][2]-0.1,k:"H",P:[PV[vi]],a:fade});
      if(st==="lp") items.push({z:PV[vi][2]-0.1,k:"lp",P:[PC,PV[vi]],a:fade});
      if(st==="bond") items.push({z:PV[vi][2]-0.05,k:"meet",P:[PV[vi]]});
    });
    atomsDraw.push({z:PC[2],k:"atom",P:[PC],c:ac,lab:NAMES[ai]});
  });
  items.sort((p,q)=>q.z-p.z);
  atomsDraw.sort((p,q)=>q.z-p.z);
  for(const it of items.concat(atomsDraw)){
    const P=it.P;
    if(it.k==="face"){g.beginPath();P.forEach((q,i)=>i?g.lineTo(q[0],q[1]):g.moveTo(q[0],q[1]));g.closePath();g.fillStyle=it.c;g.fill();}
    else if(it.k==="edge"){g.beginPath();g.moveTo(P[0][0],P[0][1]);g.lineTo(P[1][0],P[1][1]);g.strokeStyle=it.c;g.lineWidth=1.5;g.setLineDash([6,6]);g.stroke();g.setLineDash([]);}
    else if(it.k==="arm"){g.beginPath();g.moveTo(P[0][0],P[0][1]);g.lineTo(P[1][0],P[1][1]);g.strokeStyle=it.c;g.lineWidth=R*0.75;g.lineCap="round";g.stroke();}
    else if(it.k==="meet"){const q=P[0];g.beginPath();g.arc(q[0],q[1],R*0.9,0,7);g.fillStyle=pal.bond;g.fill();}
    else if(it.k==="H"){const q=P[0];g.globalAlpha=it.a;g.beginPath();g.arc(q[0],q[1],R*1.25*q[3],0,7);g.fillStyle=css("--hball");g.fill();g.lineWidth=3;g.strokeStyle=css("--hline");g.stroke();
      g.fillStyle=css("--fg");g.font=`700 ${R*1.3}px ${css("--f-mono")}`;g.textAlign="center";g.textBaseline="middle";g.fillText("H",q[0],q[1]+1);g.globalAlpha=1;}
    else if(it.k==="lp"){const c=P[0],q=P[1],dx=q[0]-c[0],dy=q[1]-c[1],L=Math.hypot(dx,dy)||1,nx=-dy/L,ny=dx/L;
      g.globalAlpha=it.a;g.fillStyle=pal.lp;for(const s of[-1,1]){g.beginPath();g.arc(q[0]+nx*s*R*0.9+dx/L*R*0.6,q[1]+ny*s*R*0.9+dy/L*R*0.6,R*0.55,0,7);g.fill();}g.globalAlpha=1;}
    else if(it.k==="atom"){const q=P[0];g.beginPath();g.arc(q[0],q[1],R*1.9*q[3],0,7);g.fillStyle=it.c;g.fill();
      g.fillStyle=css("--panel");g.font=`700 ${R*(it.lab.length>1?1.15:1.5)}px ${css("--f-mono")}`;g.textAlign="center";g.textBaseline="middle";g.fillText(it.lab,q[0],q[1]+1);}
  }
  // 図の中の見出しと凡例（埋め込みで下が切れても読めるように）
  g.textAlign="left";g.textBaseline="top";
  g.fillStyle=css("--fg");g.font=`700 ${R*1.6}px ${css("--f-body")}`;g.fillText(S.cap,R*1.0,R*0.9);
  g.fillStyle=css("--muted");g.font=`${R*1.25}px ${css("--f-body")}`;g.fillText(STAGES[stage],R*1.0,R*3.0);
  const leg=[["idle","まだ決まっていない腕"],["bond","相手とつないだ腕"]];
  if(atoms.some(a=>a.arms.includes("H"))) leg.push(["H","水素がついた腕"]);
  if(atoms.some(a=>a.arms.includes("lp"))) leg.push(["lp","自分の電子 2 個で埋まった腕"]);
  let y=cv.height-R*1.5*leg.length+R*0.2;
  g.font=`${R*1.15}px ${css("--f-body")}`;g.textBaseline="middle";
  for(const [k,t] of leg){g.fillStyle=pal[k];g.fillRect(R*1.0,y-R*0.3,R*2.0,R*0.6);g.fillStyle=css("--fg");g.fillText(t,R*3.4,y);y+=R*1.5;}
}
function renderTally(){
  const el=document.getElementById("tally"); el.innerHTML="";
  atoms.forEach((a,ai)=>{
    const d=document.createElement("div");d.className="atom";
    const b=document.createElement("b");b.textContent=NAMES[ai];d.appendChild(b);
    a.arms.forEach(s=>{const c=document.createElement("span");c.className="chip";c.style.background=`var(${COL[armState(s)]})`;d.appendChild(c);});
    el.appendChild(d);
  });
  const L=document.createElement("span");L.className="len";L.textContent=`中心どうしの長さ² ${S.len2}`;el.appendChild(L);
}
function setStage(s){stage=(s+4)%4;tStage=0;renderTally();}
const pb=document.getElementById("play");
pb.onclick=()=>{play=!play;pb.setAttribute("aria-pressed",play);pb.textContent=play?"再生中":"止めている";};
document.getElementById("step").onclick=()=>{play=false;pb.setAttribute("aria-pressed",false);pb.textContent="止めている";setStage(stage+1);};
document.getElementById("spin").onclick=e=>{spin=!spin;e.target.setAttribute("aria-pressed",spin);};
document.getElementById("spd").oninput=e=>{speed=e.target.value/100;};
let drag=null;
cv.addEventListener("pointerdown",e=>{drag=[e.clientX,e.clientY];cv.setPointerCapture(e.pointerId);});
cv.addEventListener("pointermove",e=>{if(!drag)return;tilt+=(e.clientX-drag[0])*0.01;theta+=(e.clientY-drag[1])*0.01;drag=[e.clientX,e.clientY];});
cv.addEventListener("pointerup",()=>drag=null);
if(matchMedia("(prefers-reduced-motion: reduce)").matches){spin=false;play=false;document.getElementById("spin").setAttribute("aria-pressed",false);pb.setAttribute("aria-pressed",false);pb.textContent="止めている";stage=3;tStage=1;}
const HOLD=[2.2,2.6,2.2,4.5];
function tick(t){
  const dt=Math.min(0.05,(t-last)/1000); last=t;
  const k=0.3+speed*1.7;
  if(spin) theta+=dt*0.5*k;
  tStage+=dt*(play?k:1)*(play||stage===1||stage===3?1:0);
  if(play&&tStage>HOLD[stage]) setStage(stage+1);
  draw(); requestAnimationFrame(tick);
}
renderTally(); requestAnimationFrame(tick);
</script>
